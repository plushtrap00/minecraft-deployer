<div class="page" id="page-manage">
  <div class="card">
    <div class="card-head">
      <h2>Modpacks instalados</h2>
      <button type="button" class="btn-ghost btn-sm" id="btn-refresh-packs"><svg class="icon" aria-hidden="true"><use href="#i-refresh-cw"/></svg> Actualizar</button>
    </div>
    <div id="modpack-list"><div class="skeleton-rows" role="status" aria-label="Cargando"><div></div><div></div><div></div></div></div>
  </div>
  <div id="mgmt-panel">
    <div class="card pb-0 mgmt-card" id="mgmt-card">
      <div class="card-head">
        <h2 class="mgmt-heading"><span class="mgmt-icon" id="mgmt-icon"></span><span class="mgmt-heading-label">Gestionando</span> <span id="mgmt-title" class="mgmt-title"></span></h2>
        <div class="mgmt-head-actions">
          <button type="button" id="btn-pregen" class="btn-secondary btn-sm" title="Genera de antemano el terreno alrededor del spawn (con el mod Chunky)"><svg class="icon" aria-hidden="true"><use href="#i-map"/></svg> Pregenerar</button>
          <button type="button" class="btn-secondary btn-sm" id="btn-client-pack"><svg class="icon" aria-hidden="true"><use href="#i-package"/></svg> Paquete para jugadores</button>
          <button type="button" class="btn-secondary btn-sm" id="btn-update-modpack"><svg class="icon" aria-hidden="true"><use href="#i-package-plus"/></svg> Actualizar modpack</button>
          <button type="button" class="btn-secondary btn-sm" id="btn-clone-modpack"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg> Clonar</button>
          <button type="button" class="btn-danger btn-sm" id="btn-delete-modpack"><svg class="icon" aria-hidden="true"><use href="#i-trash-2"/></svg> Borrar modpack</button>
        </div>
      </div>
      <div class="mgmt-tabs" id="mgmt-panel-tabs">
        <button type="button" class="mgmt-tab active" id="mtab-props"><svg class="icon" aria-hidden="true"><use href="#i-sliders-horizontal"/></svg>server.properties</button>
        <button type="button" class="mgmt-tab" id="mtab-ram"><svg class="icon" aria-hidden="true"><use href="#i-memory-stick"/></svg>RAM</button>
        <button type="button" class="mgmt-tab" id="mtab-configs"><svg class="icon" aria-hidden="true"><use href="#i-wrench"/></svg>Config de mods</button>
        <button type="button" class="mgmt-tab" id="mtab-kubejs"><svg class="icon" aria-hidden="true"><use href="#i-scroll-text"/></svg>KubeJS</button>
        <button type="button" class="mgmt-tab" id="mtab-worldfiles"><svg class="icon" aria-hidden="true"><use href="#i-map"/></svg>Archivos de mundo</button>
        <button type="button" class="mgmt-tab" id="mtab-logs"><svg class="icon" aria-hidden="true"><use href="#i-file-text"/></svg>Logs</button>
        <button type="button" class="mgmt-tab" id="mtab-mods"><svg class="icon" aria-hidden="true"><use href="#i-puzzle"/></svg>Mods</button>
        <button type="button" class="mgmt-tab" id="mtab-backups"><svg class="icon" aria-hidden="true"><use href="#i-archive"/></svg>Copias</button>
      </div>
    </div>

</div>
