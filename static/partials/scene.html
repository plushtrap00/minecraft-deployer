<!-- Escena pixelada (cielo, astro, nubes, colinas y suelo). La pinta
     scene.css según el data-state del contenedor más cercano; en el login
     siempre es de noche. Solo decorativa. -->
<div class="scene" aria-hidden="true">
  <div class="scene-sky scene-sky-dawn"></div>
  <div class="scene-sky scene-sky-day"></div>
  <div class="scene-stars"></div>
  <div class="scene-stars scene-stars-twinkle"></div>
  <div class="scene-orb"></div>
  <div class="scene-clouds"><span class="scene-cloud"></span><span class="scene-cloud"></span><span class="scene-cloud"></span></div>
  <div class="scene-hills scene-hills-far"></div>
  <div class="scene-hills"></div>
  <div class="scene-ground"></div>
</div>
