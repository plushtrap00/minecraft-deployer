<!-- Cambiar la contraseña propia, o (admin) poner una nueva a otro usuario. Ver password.js -->
<div class="modal-overlay" id="password-modal" aria-labelledby="password-title">
  <div class="modal modal-dialog">
    <div class="modal-header">
      <span class="modal-icon"><svg class="icon"><use href="#i-lock"/></svg></span>
      <span class="dialog-title" id="password-title">Cambiar contraseña</span>
      <button class="modal-close" id="password-close" aria-label="Cerrar"><svg class="icon"><use href="#i-x"/></svg></button>
    </div>
    <form id="password-form" autocomplete="on">
      <!-- Para que el gestor de contraseñas del navegador sepa de qué cuenta es. -->
      <input type="text" id="password-username" autocomplete="username" hidden>
      <div class="dialog-body">
        <p class="clone-intro" id="password-intro"></p>
        <div class="prop-field" id="password-current-field">
          <label class="prop-label" for="password-current">Contraseña actual</label>
          <input type="password" id="password-current" class="w-full" autocomplete="current-password">
        </div>
        <div class="prop-field">
          <label class="prop-label" for="password-new">Contraseña nueva</label>
          <input type="password" id="password-new" class="w-full" autocomplete="new-password" maxlength="72">
        </div>
        <div class="prop-field">
          <label class="prop-label" for="password-repeat">Repite la contraseña nueva</label>
          <input type="password" id="password-repeat" class="w-full" autocomplete="new-password" maxlength="72">
        </div>
        <div class="field-error" id="password-error" role="alert"></div>
        <p class="field-hint">Mínimo 8 caracteres, sin emojis. Las demás sesiones abiertas con esta cuenta se cerrarán.</p>
      </div>
      <div class="dialog-footer">
        <button type="button" class="btn-secondary" id="password-cancel">Cancelar</button>
        <button type="submit" class="btn-go" id="password-submit">Guardar</button>
      </div>
    </form>
  </div>
</div>
