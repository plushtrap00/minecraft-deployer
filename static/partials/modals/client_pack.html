<!-- Paquete para jugadores: el modpack del servidor para instalarlo en un launcher (client_pack.js) -->
<div class="modal-overlay" id="client-pack-modal">
  <div class="modal client-pack-dialog">
    <div class="modal-header">
      <span class="modal-icon"><svg class="icon" aria-hidden="true"><use href="#i-package"/></svg></span>
      <span class="modal-path">Paquete para jugadores <span id="client-pack-title"></span></span>
      <button type="button" class="modal-close" id="client-pack-close" aria-label="Cerrar"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="modal-scroll" id="client-pack-body"></div>
    </div>
    <div class="modal-footer mod-dl-footer">
      <div class="flex-1"></div>
      <button type="button" class="btn-secondary" id="client-pack-cancel">Cerrar</button>
    </div>
  </div>
</div>
