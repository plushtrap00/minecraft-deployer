<!-- Actualizar el servidor a otra versión de su modpack (pack_update.js) -->
<div class="modal-overlay" id="pack-update-modal">
  <div class="modal pack-update-dialog">
    <div class="modal-header">
      <span class="modal-icon"><svg class="icon" aria-hidden="true"><use href="#i-package-plus"/></svg></span>
      <span class="modal-path">Actualizar el modpack</span>
      <button type="button" class="modal-close" id="pack-update-close" aria-label="Cerrar"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="modal-scroll" id="pack-update-body"></div>
    </div>
    <div class="modal-footer mod-dl-footer">
      <button type="button" class="btn-secondary" id="pack-update-cancel">Cerrar</button>
      <button type="button" class="btn-primary" id="pack-update-go" hidden>Actualizar a esta versión</button>
    </div>
  </div>
</div>
