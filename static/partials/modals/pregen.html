<!-- Pregenerar el mundo con Chunky (pregen.js) -->
<div class="modal-overlay" id="pregen-modal">
  <div class="modal pregen-dialog">
    <div class="modal-header">
      <span class="modal-icon"><svg class="icon" aria-hidden="true"><use href="#i-map"/></svg></span>
      <span class="modal-path">Pregenerar el mundo <span id="pregen-title"></span></span>
      <button class="modal-close" id="pregen-close" aria-label="Cerrar"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="modal-scroll" id="pregen-body"></div>
    </div>
    <div class="modal-footer mod-dl-footer">
      <div class="flex-1" id="pregen-footer-left"></div>
      <button class="btn-secondary" id="pregen-cancel">Cerrar</button>
    </div>
  </div>
</div>
