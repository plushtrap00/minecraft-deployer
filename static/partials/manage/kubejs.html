<!-- KubeJS -->
<div class="mgmt-content" id="mgmt-kubejs">
  <div class="card">
    <div class="info-box">Scripts de KubeJS para modificar el comportamiento del modpack mediante código.</div>
    <div class="config-sidebar">
      <div class="config-search kjs-search-row">
        <input type="text" id="kubejs-search" placeholder="Buscar script…">
        <button class="btn-secondary btn-sm" id="btn-new-kjs-file" title="Crear un script nuevo"><svg class="icon"><use href="#i-plus"/></svg>Nuevo</button>
        <a class="btn-secondary btn-sm" id="btn-download-kjs" title="Descargar la carpeta kubejs/ como .zip"><svg class="icon"><use href="#i-download"/></svg>Descargar</a>
      </div>
      <div class="mod-tree-body" id="kubejs-tree"><div class="pad-m"><div class="skeleton-rows" role="status" aria-label="Cargando"><div></div><div></div><div></div></div></div></div>
      <div class="tree-count" id="kubejs-tree-count" aria-live="polite" style="display:none"></div>
    </div>
    <div id="kjs-new-file-form" class="new-world-form mt-m" style="display:none">
      <div class="form-panel-title">Nuevo script de KubeJS</div>
      <div class="props-grid mb-m">
        <div class="prop-field">
          <label class="prop-label">Carpeta <span class="req">*</span></label>
          <select id="kjs-subfolder">
            <option value="startup_scripts">startup_scripts/</option>
            <option value="server_scripts">server_scripts/</option>
            <option value="client_scripts">client_scripts/</option>
            <option value="__root__">Raíz (kubejs/)</option>
            <option value="__custom__">Personalizado...</option>
          </select>
        </div>
        <div class="prop-field" id="kjs-custom-folder-field" style="display:none">
          <label class="prop-label">Ruta personalizada</label>
          <input type="text" id="kjs-custom-folder" placeholder="ej: assets, data/mymod...">
        </div>
        <div class="prop-field">
          <label class="prop-label">Nombre del archivo <span class="req">*</span></label>
          <input type="text" id="kjs-new-filename" placeholder="ej: recipes.js, startup.js...">
          <span class="hint">Se añade .js si no tiene extensión</span>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-secondary" id="kjs-cancel-new">Cancelar</button>
        <button id="kjs-confirm-new">Crear script</button>
      </div>
    </div>
    <p class="hint mt-m">Haz clic en cualquier archivo para editarlo</p>
  </div>
</div>
