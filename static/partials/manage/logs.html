<!-- Logs -->
<div class="mgmt-content" id="mgmt-logs">
  <div class="card">
    <div class="info-box">Logs del servidor y crash reports. Los crashes muestran el mod culpable cuando se puede identificar.</div>

    <div class="log-layout">
      <!-- Sidebar: file list -->
      <div>
        <div class="log-section-title">Logs recientes</div>
        <div id="log-file-list" class="log-file-list-wrap">
          <div class="skeleton-rows" role="status" aria-label="Cargando"><div></div><div></div><div></div></div>
        </div>
        <div class="log-section-title">Crash reports</div>
        <div id="crash-file-list" class="crash-file-list-wrap">
          <p class="empty-msg">Cargando…</p>
        </div>
      </div>

      <!-- Main: log viewer -->
      <div class="log-main">
        <div id="crash-culprit" class="crash-culprit-box" style="display:none">
          <div class="crash-culprit-title"><svg class="icon"><use href="#i-triangle-alert"/></svg>Análisis del crash</div>
          <div id="crash-exception-summary" class="crash-exception-summary"></div>
          <div id="crash-culprit-mods" class="crash-culprit-detail"></div>
          <details id="crash-caused-by-details" class="crash-caused-by-details" style="display:none">
            <summary>Cadena de causas (caused by)</summary>
            <div id="crash-caused-by" class="crash-caused-by"></div>
          </details>
        </div>

        <div class="log-filters">
          <input type="text" id="log-search" placeholder="Buscar en el log…" class="flex-1 log-search">
          <select id="log-filter" class="log-filter-select">
            <option value="all">Todas las líneas</option>
            <option value="error">ERROR / FATAL</option>
            <option value="warn">WARN</option>
            <option value="errors-warns">ERROR + WARN</option>
            <option value="info">INFO</option>
          </select>
          <span id="log-match-count" class="log-match-count"></span>
          <a id="log-download-link" class="btn-secondary btn-sm" download title="Descargar el archivo completo" style="display:none"><svg class="icon"><use href="#i-download"/></svg>Descargar</a>
        </div>

        <div id="log-placeholder" class="log-placeholder">
          Selecciona un archivo del panel izquierdo
        </div>
        <div id="log-viewer" class="log-viewer" style="display:none"></div>
        <div class="mod-modal-pagination" id="log-pagination"></div>
      </div>
    </div>
  </div>
</div>
