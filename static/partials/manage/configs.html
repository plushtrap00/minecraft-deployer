<!-- Config de mods -->
<div class="mgmt-content" id="mgmt-configs">
  <div class="card">
    <div class="info-box">Configuración de los mods instalados. Los cambios se aplican al reiniciar el servidor.</div>
    <div class="config-sidebar">
      <div class="config-search"><input type="text" id="mod-search" placeholder="Buscar mod…"></div>
      <div class="mod-tree-body" id="mod-tree"><div class="pad-m"><div class="skeleton-rows" role="status" aria-label="Cargando"><div></div><div></div><div></div></div></div></div>
      <div class="tree-count" id="mod-tree-count" aria-live="polite" style="display:none"></div>
    </div>
    <p class="hint mt-m">Haz clic en cualquier archivo para editarlo en el editor</p>
  </div>
</div>
