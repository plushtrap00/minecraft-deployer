<!-- Archivos de mundo -->
<div class="mgmt-content" id="mgmt-worldfiles">
  <div class="card">
    <div class="info-box">Archivos de texto editables de cada mundo: estadísticas, logros y datapacks. Los binarios (level.dat, region/, playerdata) no se muestran.</div>
    <div class="config-sidebar">
      <div class="config-search">
        <select id="wf-world-select" class="w-full mb-s">
          <option value="">Selecciona un mundo...</option>
        </select>
        <input type="text" id="wf-search" placeholder="Buscar archivo…">
      </div>
      <div class="mod-tree-body" id="wf-tree"><p class="empty-msg pad-m">Selecciona un mundo</p></div>
      <div class="pagination" id="wf-pagination" style="display:none">
        <button id="wfpg-prev" aria-label="Página anterior"><svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg></button><span id="wfpg-info"></span><button id="wfpg-next" aria-label="Página siguiente"><svg class="icon" aria-hidden="true"><use href="#i-chevron-right"/></svg></button>
      </div>
    </div>
    <p class="hint mt-m">Haz clic en cualquier archivo para editarlo</p>
  </div>
</div>
